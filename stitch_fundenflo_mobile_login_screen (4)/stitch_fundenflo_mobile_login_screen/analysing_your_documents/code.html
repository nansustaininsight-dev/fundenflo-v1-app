  </head><body class="bg-surface text-on-surface font-body-md text-body-md min-h-screen flex flex-col antialiased selection:bg-secondary-container"><main class="flex-1 flex flex-col w-full bg-surface pt-safe pb-safe"><div class="flex flex-col w-full px-margin py-space-xl justify-between min-h-[580px] max-w-[420px] mx-auto select-none">
<div class="flex flex-col items-center w-full">
<!-- Visual Dynamic Arc & Document Emblem -->
<div class="relative flex items-center justify-center w-36 h-36 mt-space-md mb-space-lg">
<!-- Ambient Golden Glow -->
<div class="absolute inset-2 rounded-full bg-tertiary-fixed-dim/15 blur-xl animate-pulse"></div>
<!-- Rotating Golden Progress Arc with Growth Arrowhead -->
<svg class="absolute inset-0 w-full h-full animate-[spin_4s_linear_infinite]" fill="none" viewbox="0 0 144 144">
<defs>
<lineargradient id="goldArcGrad" x1="0%" x2="100%" y1="100%" y2="0%">
<stop offset="0%" stop-color="#C59B27" stop-opacity="0.1"></stop>
<stop offset="60%" stop-color="#ffbb06" stop-opacity="0.75"></stop>
<stop offset="100%" stop-color="#ffbb06" stop-opacity="1"></stop>
</lineargradient>
</defs>
<!-- Background orbital track -->
<circle cx="72" cy="72" r="62" stroke="#eceef0" stroke-linecap="round" stroke-width="2.5"></circle>
<!-- Dynamic sweeping arc -->
<path d="M 72 10 A 62 62 0 1 1 18 96" stroke="url(#goldArcGrad)" stroke-linecap="round" stroke-width="3"></path>
<!-- Precision upward directional arrowhead at apex of arc -->
<polygon fill="#ffbb06" points="72,5 77,14 67,14"></polygon>
</svg>
<!-- Center Fiduciary Document Icon Plate -->
<div class="relative z-10 flex items-center justify-center w-20 h-20 rounded-full bg-surface-container-lowest shadow-sm">
<span class="material-symbols-outlined text-primary-container text-[38px]">description</span>
</div>
</div>
<!-- Screen Title -->
<h1 class="font-headline-md text-headline-md text-primary-container text-center tracking-tight mb-space-xl">
      Reading your documents
    </h1>
<!-- Institutional Status Checklist Container -->
<div class="w-full bg-surface-container-lowest rounded-xl shadow-sm p-margin flex flex-col gap-space-md">
<!-- Row 1: Completed State -->
<div class="flex items-center gap-space-md">
<div class="flex-shrink-0 flex items-center justify-center w-6 h-6 rounded-full bg-status-success/10 text-status-success">
<span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<div class="flex-1 min-w-0">
<p class="font-body-md text-body-md text-on-surface">Bank statement read</p>
</div>
</div>
<!-- Tonal Separator -->
<div class="w-full h-[1px] bg-surface-subtle"></div>
<!-- Row 2: In-Progress Active Step -->
<div class="flex items-center gap-space-md">
<div class="flex-shrink-0 flex items-center justify-center w-6 h-6">
<svg class="w-5 h-5 animate-spin text-tertiary-fixed-dim" fill="none" viewbox="0 0 24 24">
<circle cx="12" cy="12" r="9" stroke="#eceef0" stroke-width="2.5"></circle>
<path d="M12 3a9 9 0 0 1 9 9" stroke="#ffbb06" stroke-linecap="round" stroke-width="2.5"></path>
</svg>
</div>
<div class="flex-1 min-w-0">
<p class="font-label-lg text-label-lg text-primary-container">Checking GST &amp; ITR consistency</p>
</div>
</div>
<!-- Tonal Separator -->
<div class="w-full h-[1px] bg-surface-subtle"></div>
<!-- Row 3: Pending Step -->
<div class="flex items-center gap-space-md">
<div class="flex-shrink-0 flex items-center justify-center w-6 h-6">
<div class="w-4 h-4 rounded-full bg-surface-subtle"></div>
</div>
<div class="flex-1 min-w-0">
<p class="font-body-md text-body-md text-text-muted">Finding verified lenders</p>
</div>
</div>
</div>

<p class="font-body-sm text-body-sm text-text-muted text-center px-space-md mt-space-lg leading-relaxed">
      Usually takes under 2 minutes. You can safely leave — we will notify you on WhatsApp.
    </p>
</div>
<!-- Bottom Anchor: WhatsApp Text Action Link -->
<div class="w-full flex justify-center items-center pt-space-xl pb-space-sm">
<button class="inline-flex items-center gap-space-xs text-primary-container hover:text-secondary active:opacity-75 transition-opacity py-space-xs px-space-sm rounded-lg bg-transparent" id="whatsappNotifyBtn" type="button">
<span class="material-symbols-outlined text-[20px] text-status-success" style="font-variation-settings: 'FILL' 1;">chat</span>
<span class="font-label-md text-label-md text-primary-container" id="whatsappNotifyText">Notify me on WhatsApp</span>
</button>
</div>
</div>
<script>
  (function() {
    const notifyBtn = document.getElementById('whatsappNotifyBtn');
    const notifyText = document.getElementById('whatsappNotifyText');
    if (notifyBtn && notifyText) {
      notifyBtn.addEventListener('click', function() {
        notifyText.textContent = 'Notification scheduled';
        notifyBtn.classList.add('pointer-events-none');
        notifyBtn.classList.add('opacity-80');
      });
    }
  })();
