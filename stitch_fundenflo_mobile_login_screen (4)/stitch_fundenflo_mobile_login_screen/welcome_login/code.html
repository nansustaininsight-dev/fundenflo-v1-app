<!DOCTYPE html><html class="h-full" lang="en"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><meta content="mobile_blank" name="shell-type"><link href="https://fonts.googleapis.com" rel="preconnect"><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&amp;display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><style>@layer base{html,body{width:100%;margin:0;padding:0;min-height:100%;}body{overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "on-background": "#191c1e", "secondary-fixed": "#d6e3ff", "on-primary-container": "#76849f", "primary": "#000000", "surface-bright": "#f8f9fc", "tertiary-fixed-dim": "#ffbb06", "on-error": "#ffffff", "surface-container-low": "#f2f4f6", "error": "#ba1a1a", "secondary-container": "#a8c8ff", "secondary": "#3f5f90", "tertiary-container": "#271900", "primary-container": "#0d1c32", "on-primary-fixed-variant": "#39475f", "on-tertiary-fixed": "#271900", "primary-fixed": "#d6e3ff", "error-container": "#ffdad6", "on-secondary-fixed": "#001b3c", "primary-fixed-dim": "#b9c7e4", "inverse-primary": "#b9c7e4", "surface": "#f8f9fc", "surface-container-high": "#e7e8eb", "card-surface": "#FFFFFF", "on-secondary-fixed-variant": "#264776", "text-muted": "#64748B", "secondary-fixed-dim": "#a8c8ff", "surface-subtle": "#F0F4F8", "on-primary-fixed": "#0d1c32", "border-subtle": "#E2E8F0", "inverse-surface": "#2e3133", "on-surface": "#191c1e", "on-surface-variant": "#44474d", "inverse-on-surface": "#eff1f3", "on-secondary-container": "#335383", "on-tertiary-container": "#ab7c00", "surface-container": "#eceef0", "surface-container-lowest": "#ffffff", "surface-tint": "#515f78", "tertiary-fixed": "#ffdea5", "surface-variant": "#e1e2e5", "on-tertiary-fixed-variant": "#5d4200", "tertiary": "#000000", "on-primary": "#ffffff", "on-secondary": "#ffffff", "on-error-container": "#93000a", "background": "#f8f9fc", "outline-variant": "#c5c6cd", "gold-deep": "#C59B27", "surface-dim": "#d8dadd", "on-tertiary": "#ffffff", "status-success": "#1F7A43", "surface-container-highest": "#e1e2e5", "outline": "#75777e", "surface-base": "#F8FBFF" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "margin": "1.25rem", "space-sm": "0.5rem", "gutter": "1rem", "space-lg": "1.5rem", "space-md": "1rem", "space-xs": "0.25rem", "space-xl": "2rem" }, "fontFamily": { "headline-lg": ["Space Grotesk"], "body-md": ["Inter"], "label-md": ["Inter"], "headline-sm": ["Space Grotesk"], "label-sm": ["Inter"], "display-lg-mobile": ["Space Grotesk"], "display-lg": ["Space Grotesk"], "body-lg": ["Inter"], "body-sm": ["Inter"], "headline-md": ["Space Grotesk"], "label-lg": ["Inter"] }, "fontSize": { "headline-lg": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "600" }], "headline-sm": ["18px", { "lineHeight": "26px", "fontWeight": "600" }], "label-sm": ["10px", { "lineHeight": "14px", "letterSpacing": "0.04em", "fontWeight": "600" }], "display-lg-mobile": ["30px", { "lineHeight": "38px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "display-lg": ["36px", { "lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "600" }], "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "body-sm": ["12px", { "lineHeight": "18px", "fontWeight": "400" }], "headline-md": ["22px", { "lineHeight": "30px", "fontWeight": "600" }], "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600" }] } } } };</script></head><body class="bg-surface-base text-on-surface antialiased flex flex-col min-h-full"><main class="flex-1 flex flex-col w-full relative bg-surface-base"><div class="flex flex-col w-full">
<!-- Top Hero Container: Architectural Dark Navy Gradient (45% aesthetic proportion) -->
<div class="relative w-full bg-gradient-to-b from-[#0A192F] to-[#0D2040] text-on-primary px-margin pt-6 pb-10 flex flex-col justify-between overflow-hidden shadow-sm">
<!-- Subtle Ambient Illumination (No clutter, purely calm private-bank atmospheric depth) -->
<div class="absolute -top-24 -right-16 w-72 h-72 rounded-full bg-[#1B365D]/30 blur-3xl pointer-events-none"></div>
<div class="absolute bottom-4 -left-12 w-48 h-48 rounded-full bg-[#C59B27]/10 blur-2xl pointer-events-none"></div>
<!-- Top Utility Bar: Language Selector -->
<div class="relative z-10 flex items-center justify-between w-full mb-6">
<!-- Institutional Category Pill -->
<div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-white/5 backdrop-blur-md">
<span class="w-1.5 h-1.5 rounded-full bg-[#FDB901] shadow-[0_0_8px_#FDB901]"></span>
<span class="font-label-sm text-label-sm text-surface-container tracking-wider uppercase">MSME &amp; Personal Funding</span>
</div>
<!-- Language Toggle Pill -->
<div class="inline-flex items-center p-0.5 rounded-full bg-white/10 backdrop-blur-md">
<button class="px-2.5 py-1 rounded-full font-label-sm text-label-sm font-semibold transition-all duration-200 bg-[#C59B27] text-primary-container shadow-sm" id="lang-en" type="button">
          EN
        </button>
<button class="px-2.5 py-1 rounded-full font-label-sm text-label-sm text-surface-container/70 hover:text-white transition-all duration-200" id="lang-hi" type="button">
          हिं
        </button>
</div>
</div>
<!-- Brand Identity Block -->
<div class="relative z-10 flex flex-col gap-2 mb-6">
<div class="flex items-center gap-2.5">
<!-- FundenFlo Official Monogram Accent & Wordmark -->
<div class="w-9 h-9 rounded-xl bg-white/10 flex items-center justify-center p-1.5">
<svg class="w-full h-full text-[#FDB901]" fill="none" viewBox="0 0 100 100">
<path d="M 22 52 C 22 34 36 20 54 20 C 70 20 83 31 86 46" stroke="currentColor" stroke-linecap="round" stroke-width="12"></path>
<path d="M 40 68 L 74 34 M 74 34 L 54 34 M 74 34 L 74 54" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="12"></path>
</svg>
</div>
<div class="flex flex-col">
<div class="flex items-baseline"><span class="text-headline-md tracking-tight text-white font-bold" style="font-family: Poppins, sans-serif;">FundenFlo</span></div>
</div>
</div>
<p class="font-label-md text-label-md tracking-wide text-[#94A3B8] font-normal pl-0.5">
        The Right Funding, At the Right Time
      </p>
</div>
<!-- Editorial Value Proposition -->
<div class="relative z-10 flex flex-col gap-2 mt-auto">
<h1 class="font-display-lg-mobile text-display-lg-mobile text-white font-semibold leading-tight tracking-tight" style="font-family: Poppins, sans-serif;">
        Know who can fund you — in minutes
      </h1>
<p class="font-body-md text-body-md text-[#94A3B8] max-w-[340px] leading-relaxed">
        Upload a few documents. See matching lenders. Track till disbursal.
      </p>
</div>
</div>
<!-- Bottom Interactive Surface: Private Banking Sheet Layout -->
<div class="relative z-20 -mt-5 bg-card-surface rounded-t-[28px] px-margin pt-7 pb-8 flex-1 flex flex-col justify-between shadow-[0_-12px_32px_rgba(10,25,47,0.08)]">
<!-- Pull Bar Indicator (Refined Architectural Cue) -->
<div class="w-10 h-1 rounded-full bg-surface-container-high mx-auto mb-6"></div>
<!-- Auth Module -->
<div class="flex flex-col gap-5">
<!-- Input Field Group -->
<div class="flex flex-col gap-2">
<label class="font-label-lg text-label-lg text-on-surface font-medium flex items-center justify-between" for="mobile-number">
<span class="">Mobile number</span>

</label>
<!-- Phone Input Container -->
<div class="relative flex items-center h-[54px] w-full bg-surface-container-low rounded-xl px-3.5 transition-all focus-within:bg-card-surface focus-within:shadow-[0_0_0_2px_#0A192F]">
<!-- India Flag & Country Code -->
<div class="flex items-center gap-2 pr-3 select-none">
<!-- Precise Vector Tiranga Pin -->
<div class="w-5 h-3.5 rounded-[2px] overflow-hidden flex flex-col shadow-xs">
<div class="h-1/3 bg-[#FF9933] w-full"></div>
<div class="h-1/3 bg-white w-full flex items-center justify-center">
<div class="w-1 h-1 rounded-full bg-[#000080]"></div>
</div>
<div class="h-1/3 bg-[#128807] w-full"></div>
</div>
<span class="font-body-md text-body-md font-semibold text-on-surface">+91</span>
</div>
<!-- Divider Tonal Accent -->
<div class="h-5 w-[1px] bg-border-subtle mr-3"></div>
<!-- Number Field -->
<input autocomplete="tel-national" class="flex-1 bg-transparent font-body-lg text-body-lg text-on-surface placeholder:text-text-muted/60 focus:outline-none tracking-wider font-medium" id="mobile-number" inputmode="numeric" maxlength="10" placeholder="98765 43210" type="tel">
<!-- Live Input Validation Indicator -->
<span class="material-symbols-outlined text-status-success opacity-0 transition-opacity text-[20px] select-none" id="valid-check">
            check_circle
          </span>
</div>
</div>
<!-- Action Button -->
<button class="w-full h-[52px] bg-[#0A192F] hover:bg-[#012C5A] active:scale-[0.99] text-on-primary font-body-lg text-body-lg font-semibold rounded-xl flex items-center justify-center gap-2 transition-all shadow-md active:shadow-sm" id="otp-btn" type="button">
<span class="">Get OTP</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
<!-- Referral Accordion / Action Link -->
<div class="flex flex-col items-center">
<button class="inline-flex items-center gap-1 font-body-md text-body-md text-[#C59B27] hover:text-[#A37E1C] font-medium py-1 transition-colors select-none" id="referral-toggle" type="button">
<span class="">Have a referral code?</span>
<span class="material-symbols-outlined text-[16px] transition-transform" id="referral-arrow">expand_more</span>
</button>
<!-- Dynamic Expandable Referral Input -->
<div class="w-full max-h-0 opacity-0 overflow-hidden transition-all duration-300 ease-in-out" id="referral-box">
<div class="pt-3">
<div class="flex items-center h-12 w-full bg-surface-container-low rounded-xl px-3.5 focus-within:bg-card-surface focus-within:shadow-[0_0_0_1.5px_#C59B27]">
<input class="flex-1 bg-transparent font-body-md text-body-md uppercase tracking-wider text-on-surface placeholder:text-text-muted/60 focus:outline-none" placeholder="Enter Advisor / Enterprise Code" type="text">
<button class="font-label-md text-label-md text-[#0A192F] font-semibold px-2 py-1 rounded bg-surface-container-high hover:bg-surface-variant transition-colors" type="button">
                Apply
              </button>
</div>
</div>
</div>
</div>
</div>
<!-- Security, Regulatory & Consent Footer -->
<div class="mt-8 flex flex-col items-center gap-3">
<!-- Institutional Compliance Assurance -->
<div class="flex items-center justify-center gap-1.5 text-text-muted">
<span class="material-symbols-outlined text-[15px] text-[#64748B]" style="font-variation-settings: 'FILL' 1;">
          lock
        </span>
<p class="font-label-sm text-label-sm text-[#64748B] text-center tracking-normal">
          256-bit encrypted · Your data is shared only with your consent
        </p>
</div>
<!-- Fiduciary Regulatory Watermark -->

</div>
</div>
</div>
<script>
  (function() {
    const input = document.getElementById('mobile-number');
    const validCheck = document.getElementById('valid-check');
    const referralToggle = document.getElementById('referral-toggle');
    const referralBox = document.getElementById('referral-box');
    const referralArrow = document.getElementById('referral-arrow');
    const langEn = document.getElementById('lang-en');
    const langHi = document.getElementById('lang-hi');

    // Phone formatting and validation cue
    input.addEventListener('input', function(e) {
      const val = e.target.value.replace(/\D/g, '');
      e.target.value = val;
      if (val.length === 10) {
        validCheck.classList.remove('opacity-0');
        validCheck.classList.add('opacity-100');
      } else {
        validCheck.classList.remove('opacity-100');
        validCheck.classList.add('opacity-0');
      }
    });

    // Expandable Referral Drawer Interaction
    let isOpen = false;
    referralToggle.addEventListener('click', function() {
      isOpen = !isOpen;
      if (isOpen) {
        referralBox.style.maxHeight = '80px';
        referralBox.classList.remove('opacity-0');
        referralBox.classList.add('opacity-100');
        referralArrow.style.transform = 'rotate(180deg)';
      } else {
        referralBox.style.maxHeight = '0px';
        referralBox.classList.remove('opacity-100');
        referralBox.classList.add('opacity-0');
        referralArrow.style.transform = 'rotate(0deg)';
      }
    });

    // Language Toggle Micro-interaction
    langHi.addEventListener('click', function() {
      langHi.classList.add('bg-[#C59B27]', 'text-primary-container', 'shadow-sm', 'font-semibold');
      langHi.classList.remove('text-surface-container/70');
      langEn.classList.remove('bg-[#C59B27]', 'text-primary-container', 'shadow-sm', 'font-semibold');
      langEn.classList.add('text-surface-container/70');
    });

    langEn.addEventListener('click', function() {
      langEn.classList.add('bg-[#C59B27]', 'text-primary-container', 'shadow-sm', 'font-semibold');
      langEn.classList.remove('text-surface-container/70');
      langHi.classList.remove('bg-[#C59B27]', 'text-primary-container', 'shadow-sm', 'font-semibold');
      langHi.classList.add('text-surface-container/70');
    });
  })();
</script></main>

</body></html>
